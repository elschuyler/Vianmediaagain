name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug & Minified Debug APKs
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x ./gradlew
          ./gradlew assembleDebug assembleMinifiedDebug --stacktrace
        else
          gradle assembleDebug assembleMinifiedDebug --stacktrace
        fi

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Minified Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-minified-debug.apk
        path: app/build/outputs/apk/minifiedDebug/*.apk

    - name: Upload R8 Mapping
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: minified-debug-mapping
        path: app/build/outputs/mapping/minifiedDebug/mapping.txt
        if-no-files-found: ignore
